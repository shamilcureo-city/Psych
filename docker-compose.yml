version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psychassess-postgres
    environment:
      POSTGRES_USER: psychassess
      POSTGRES_PASSWORD: psychassess_dev
      POSTGRES_DB: psychassess
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U psychassess']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psychassess-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
