version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psychassess-postgres
    environment:
      POSTGRES_USER: psychassess
      POSTGRES_PASSWORD: psychassess_dev
      POSTGRES_DB: psychassess
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U psychassess' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psychassess-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  psychassess-service:
    build:
      context: .
      dockerfile: services/psychassess-service/Dockerfile
    container_name: psychassess-service
    ports:
      - '3029:3029'
    environment:
      DATABASE_URL: postgresql://psychassess:psychassess_dev@postgres:5432/psychassess?schema=public
      PORT: 3029
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3004
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
